<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>View</title>
	<link rel="stylesheet" type="text/css" href="../css/simple_console.css">
	<style type="text/css" media="screen">
		html, body {
			padding: 0;
			margin: 0;
			font-size: 1em;
			line-height: 1.2;
			font-family: 'Simple Console', monospace;
		}
		pre {
			position: absolute;
			margin: 0;
			left: 0;
			top: 0;
			width: 100vw;
			height: 100vh;
			font-family: inherit;
		}
	</style>
	<script type="importmap">
		{
			"imports": {
				"@ertdfgcvb/play"            : "../src/run.js",
				"@ertdfgcvb/play/renderers/" : "../src/renderers/",
				"@ertdfgcvb/play/"           : "../src/modules/"
			}
		}
	</script>
</head>
<body>
	<pre></pre>
	<script type="module">
		// The ported examples as windows on a desktop: drag, bring to front, close.
		// cursor.js has a Desktop of its own: windows inside windows
		import { run } from '@ertdfgcvb/play'
		import { Desktop } from '@ertdfgcvb/play/window.js'

		const example = name => new URL('../src/programs/' + name + '.js', import.meta.url)
		const desk = new Desktop({ shadow : 'gray', paddingX : 0, paddingY : 0 })

		desk.open({ x : 2,  y : 1,  width : 40, height : 14, title : 'coordinates_xy', content : example('basics/coordinates_xy') })
		desk.open({ x : 46, y : 3,  width : 34, height : 12, title : 'coordinates_index', content : example('basics/coordinates_index') })
		desk.open({ x : 10, y : 17, width : 44, height : 18, title : 'how_to_draw_a_circle', content : example('basics/how_to_draw_a_circle') })
		desk.open({ x : 58, y : 17, width : 42, height : 16, title : 'cursor', content : example('basics/cursor') })

		const program = {
			main : coord => (coord.x + coord.y) % 2 ? '·' : ' ',
			post : ctx => desk.update(ctx),
		}

		await run(program, { element : document.querySelector('pre') })
	</script>
</body>
</html>
