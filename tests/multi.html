<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Test multi</title>
	<link rel="stylesheet" type="text/css" href="../css/simple_console.css">
	<style type="text/css" media="screen">
		body {
			background-color: rgb(250, 250, 250);
			margin: 2em;
			font-family: 'Simple Console', monospace;
		}
		.box {
			display: inline-block;
			margin: 1em;
			vertical-align: top;
		}
		pre, canvas {
			display: block;
			margin: 0;
			width: 40em;
			height: 22em;
			font-size: 1em;
			line-height: 1.2;
			font-family: 'Simple Console', monospace;
			background-color: white;
		}
		button {
			font: inherit;
		}
		.spacer {
			height: 150vh;
		}
	</style>
	<script type="importmap">
		{
			"imports": {
				"@ertdfgcvb/play"            : "../src/run.js",
				"@ertdfgcvb/play/renderers/" : "../src/renderers/",
				"@ertdfgcvb/play/"           : "../src/modules/"
			}
		}
	</script>
</head>
<body>
	<div class="box"><pre id="a"></pre></div>
	<div class="box"><pre id="b"></pre></div>
	<div class="box"><canvas id="c"></canvas></div>
	<div class="box"><canvas id="d"></canvas></div>
	<div class="spacer"></div>
	<div class="box"><pre id="e"></pre></div>
	<script type="module">
		import { run } from '@ertdfgcvb/play'
		// Programs as URLs: each run imports its own copy of the module
		const example = name => new URL('../src/programs/' + name + '.js', import.meta.url)
		const $ = id => document.querySelector(id)

		const handles = [
			await run(example('basics/time_milliseconds'), { element : $('#a') }),
			await run(example('basics/cursor'),            { element : $('#b') }),
			await run(example('sdf/balls'),                { element : $('#c'), renderer : 'canvas', fps : 60 }),
			await run(example('demos/doom_flame'),         { element : $('#d'), renderer : 'canvas' }),
			await run(example('basics/time_frames'),       { element : $('#e') }),
		]

		// Controls below each output
		for (const h of handles) {
			const bar = document.createElement('div')
			for (const [label, fn] of [
				['start', () => h.start()],
				['pause', () => h.pause()],
				['step',  () => h.step()],
				['stop',  () => h.stop()],
				['txt',   () => save(h, 'txt')],
				['html',  () => save(h, 'html')],
				['png',   () => save(h, 'png')],
			]) {
				const b = document.createElement('button')
				b.textContent = label
				b.onclick = fn
				bar.appendChild(b)
			}
			h.element.after(bar)
		}

		async function save(h, format) {
			try {
				const blob = await h.snapshot(format)
				const a = document.createElement('a')
				a.href = URL.createObjectURL(blob)
				a.download = 'snapshot.' + format
				a.click()
				URL.revokeObjectURL(a.href)
			} catch (e) {
				alert(e.message)
			}
		}
	</script>
</body>
</html>
