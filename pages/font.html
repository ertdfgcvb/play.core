<script type="module">

	// Per font: the metrics as measured by each renderer (context.metrics), then the glyphs per style
	import dom from '../src/renderers/dom.js'
	import canvas from '../src/renderers/canvas.js'

	const FONTS = [
		{ family : 'Simple Console', styles : [[300, 'normal'], [400, 'normal'], [700, 'normal']] },
		{ family : 'Riforma Mono',   styles : [[300, 'normal'], [300, 'italic'], [400, 'normal'], [400, 'italic'], [700, 'normal'], [700, 'italic']] },
	]
	const pattern = document.querySelector('template').innerHTML

	for (const font of FONTS) {
		const p = document.createElement('pre')
		p.style.fontFamily = "'" + font.family + "', monospace"
		document.querySelector('main').appendChild(p)

		const metrics = {}
		for (const [name, renderer] of [['dom', dom], ['canvas', canvas]]) {
			const probe = document.createElement('pre')
			probe.style.cssText = 'position:absolute;visibility:hidden;width:40em;height:10em;margin:0'
			p.appendChild(probe)
			const r = await renderer(probe, {})
			metrics[name] = r.measure().metrics
			r.dispose()
			probe.remove()
		}

		const info = document.createElement('span')
		info.style.display = 'block'
		info.textContent = font.family + '\n' + JSON.stringify(metrics, null, 4)
		p.appendChild(info)

		for (const [w, style] of font.styles) {
			const s = document.createElement('span')
			s.classList.add('test')
			s.innerHTML = 'weight: ' + w + (style == 'italic' ? ' italic' : '') + '\n' + pattern
			s.style.fontWeight = w
			s.style.fontStyle = style
			p.appendChild(s)
		}
	}

</script>
